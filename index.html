<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple two-player dice game built with HTML, CSS and JavaScript."
    />
    <meta name="theme-color" content="#393e46" />
    <title>Dicee Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Lobster&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1 class="result" aria-live="polite">Refresh Me</h1>

      <section class="players" aria-label="Dice results">
        <div class="dice">
          <p>Player 1</p>
          <img class="die-image" id="player-one-die" src="images/dice6.png" alt="Player 1 rolled a six" />
        </div>

        <div class="dice">
          <p>Player 2</p>
          <img class="die-image" id="player-two-die" src="images/dice6.png" alt="Player 2 rolled a six" />
        </div>
      </section>

      <p class="instruction">Refresh the page to roll again.</p>
    </main>

    <footer>
      <p>🎲 Dicee Challenge · A JavaScript learning project 🎲</p>
    </footer>
  </body>
</html>
